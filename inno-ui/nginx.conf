server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /profiles/ {
        proxy_pass http://profiles-api:5082/;
    }

    location /facility/ {
        proxy_pass http://facility-api:5035/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
